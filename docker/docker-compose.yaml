services:
  mongodb:
    image: mongo:9.0-resolute

    container_name: mongodb
    
    ports:
      - "27007:27017"

    volumes:
      - ./mongodb:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin

    networks:
      - backend

    restart: always

networks:
  backend: